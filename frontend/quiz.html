<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Quiz em JavaScript</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quiz-container">
    <h2 id="pergunta">Pergunta aqui</h2>
    <div id="opcoes"></div>
    <button id="btn-proximo" onclick="proximaPergunta()">Próxima</button>
    <div id="resultado" class="escondido"></div>
  </div>

  <script src="script.js"></script>
  
<style>
  body {
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  background-color: #f0f2f5;
}

.quiz-container {
  background: white;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  width: 300px;
}

button {
  display: block;
  width: 100%;
  margin: 8px 0;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  cursor: pointer;
}

button:hover {
  background-color: #e2e2e2;
}

.escondido {
  display: none;
}
</style>
</body>
</html>
