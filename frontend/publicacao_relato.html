<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Publicar Experiência - Interway</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --blue-light: #3b82f6;
    --blue: #1d4ed8;
    --blue-dark: #0f4c81;
    --blue-navy: #0a2540;
    --bg-blue: #f0f5fc;
    --blue-border: #bfdbfe;
    --text-dark: #0f172a;
    --text-muted: #475569;
    --white: #ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background: var(--bg-blue);
    color: var(--text-dark);
}

/* TOPBAR */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 24px;
    background: var(--white);
    box-shadow: 0 4px 20px rgba(15, 76, 129, 0.08);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo img{
    width:45px;
    height:45px;
    object-fit:contain;
}

.logo span{
    font-weight: 700;
    color: var(--blue-dark);
    letter-spacing: 1px;
}

.nav-buttons{
    display:flex;
    gap:10px;
}

.nav-btn{
    text-decoration:none;
    padding:10px 18px;
    border-radius:12px;
    font-weight:600;
    font-size:14px;
    transition: all .3s ease;
}

.back{
    background: #e2e8f0;
    color: var(--blue-navy);
}

.back:hover{
    background: #cbd5e1;
    transform: translateY(-2px);
}

.home{
    background: linear-gradient(135deg, var(--blue-dark), var(--blue));
    color: var(--white);
    box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25);
}

.home:hover{
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(29, 78, 216, 0.35);
}

/* HERO */
.hero{
    text-align:center;
    padding:60px 20px 20px;
}

.hero h1{
    font-size:2.5rem;
    color: var(--blue-dark);
    font-weight: 700;
}

.hero p{
    color: var(--text-muted);
    font-size: 1.1rem;
    margin-top: 5px;
}

/* FORM */
.container{
    max-width:850px;
    margin:auto;
    padding:20px;
}

.form-box{
    background: var(--white);
    padding:35px;
    border-radius:20px;
    box-shadow: 0 10px 30px rgba(15, 76, 129, 0.08);
    border: 1px solid var(--blue-border);
}

label{
    display:block;
    margin-top:18px;
    font-weight:600;
    font-size: 14px;
    color: var(--blue-navy);
}

input, select, textarea{
    width:100%;
    padding:14px 16px;
    margin-top:8px;
    border-radius:12px;
    border: 1.5px solid #dbeafe;
    background: #f8fafc;
    color: var(--text-dark);
    font-size: 14px;
    outline:none;
    transition: all .3s ease;
}

input:focus, select:focus, textarea:focus{
    border-color: var(--blue);
    background: var(--white);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
}

textarea{
    height:150px;
    resize:none;
}

button{
    margin-top:25px;
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background: linear-gradient(135deg, var(--blue-dark), var(--blue));
    color: var(--white);
    font-size: 16px;
    font-weight:700;
    cursor:pointer;
    transition: all .3s ease;
    box-shadow: 0 8px 20px rgba(15, 76, 129, 0.25);
}

button:hover{
    transform:translateY(-2px);
    box-shadow: 0 12px 25px rgba(15, 76, 129, 0.35);
    filter: brightness(1.05);
}

/* PREVIEW */
.preview{
    margin-top:30px;
    padding:30px;
    background: var(--white);
    border-radius:20px;
    box-shadow: 0 10px 30px rgba(15, 76, 129, 0.08);
    border-left: 6px solid var(--blue);
    display:none;
}

.preview h2{
    color: var(--blue-dark);
    font-size: 1.4rem;
    margin-bottom: 12px;
}

.preview img{
    width:100%;
    max-height: 400px;
    object-fit: cover;
    border-radius:14px;
    margin-top:15px;
    border: 1px solid var(--blue-border);
}

.preview h3{
    margin-top:12px;
    color: var(--blue-navy);
}

.preview p{
    color: var(--text-muted);
    margin-top: 6px;
    line-height: 1.6;
}

</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">

    <div class="logo">
        <img src="../img/logotipo.png" alt="Logo Interway"> 
        <span>INTERWAY</span>
    </div>

    <div class="nav-buttons">
        <a href="javascript:history.back()" class="nav-btn back"> Voltar</a>
        <a href="index.html" class="nav-btn home">Home</a>
    </div>

</div>

<!-- HERO -->
<div class="hero">
    <h1>Compartilhe sua Experiência</h1>
    <p>Conte como foi seu intercâmbio e inspire outras pessoas</p>
</div>

<!-- FORM -->
<div class="container">

<div class="form-box">

    <label>Seu nome</label>
    <input type="text" id="nome" placeholder="Ex: João Silva">

    <label>País do intercâmbio</label>
    <select id="pais">
        <option>Canadá</option>
        <option>EUA</option>
        <option>Irlanda</option>
        <option>Austrália</option>
        <option>Inglaterra</option>
        <option>Malta</option>
    </select>

    <label>Sua experiência</label>
    <textarea id="texto" placeholder="Conte sua experiência..."></textarea>

    <label>Foto (URL opcional)</label>
    <input type="text" id="foto" placeholder="Cole um link de imagem">

    <button onclick="publicar()">Publicar Experiência</button>

</div>

<!-- PREVIEW -->
<div class="preview" id="preview">

    <h2>✨ Sua publicação</h2>

    <h3 id="pNome"></h3>
    <p id="pPais"></p>
    <p id="pTexto"></p>
    <img id="pFoto" alt="Foto da experiência">

</div>

</div>

<script>

function publicar(){

    const nome = document.getElementById("nome").value;
    const pais = document.getElementById("pais").value;
    const texto = document.getElementById("texto").value;
    const foto = document.getElementById("foto").value;

    if(!nome || !texto){
        alert("Por favor, preencha pelo menos seu nome e a experiência!");
        return;
    }

    document.getElementById("pNome").innerText = "👤 " + nome;
    document.getElementById("pPais").innerText = "🌎 " + pais;
    document.getElementById("pTexto").innerText = texto;

    if(foto){
        document.getElementById("pFoto").src = foto;
        document.getElementById("pFoto").style.display = "block";
    } else {
        document.getElementById("pFoto").style.display = "none";
    }

    document.getElementById("preview").style.display = "block";
}

</script>

</body>
</html>
