<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Quiz de Intercâmbio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="quiz-container">
    <h2 id="pergunta">Carregando pergunta...</h2>
    <div id="opcoes"></div>
    <div id="resultado" class="escondido"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>

<style>
    body {
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  background-color: #f4f4f9;
}

#quiz-container {
  background: white;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  max-width: 500px;
  width: 100%;
  text-align: center;
}

#opcoes button {
  display: block;
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: 1px solid #007bff;
  background-color: #007bff;
  color: white;
  border-radius: 5px;
  cursor: pointer;
  font-size: 16px;
  transition: background 0.2s;
}

#opcoes button:hover {
  background-color: #0056b3;
}

.escondido {
  display: none;
}
</style>
